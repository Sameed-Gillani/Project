<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Replica</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topnav">
    <div class="spacer"></div>
    <a href="https://mail.google.com" target="_blank">Gmail</a>
    <a href="https://images.google.com" target="_blank">Images</a>
    <div class="apps-icon" id="appsIcon" title="Google apps">
      <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM18 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </div>
    <div class="avatar" id="avatar" title="Account">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>
    </div>
  </div>
  <main>
    <div class="logo">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <form class="search-box" id="searchForm">
      <div class="icon-btn" title="Add">
        <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
      <input type="text" id="searchInput" autofocus autocomplete="off">
      <div class="icon-btn" title="Search by voice">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z"/><path fill="#EA4335" d="M17 12c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V22h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
      <div class="icon-btn" title="Search by image">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
      </div>
      <div class="ai-mode" title="AI Mode">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M12 2 9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg>
        AI Mode
      </div>
    </form>
    <div class="buttons-row">
      <button type="submit" form="searchForm" class="btn">Google Search</button>
      <button type="button" class="btn" id="luckyBtn">I'm Feeling Lucky</button>
    </div>
    <div class="lang-offer">
      Google offered in:
      <a href="#">سنڌي</a>
      <a href="#">پښتو</a>
      <a href="#">اردو</a>
    </div>
  </main>
  <footer>
    <div class="footer-location">Pakistan</div>
    <div class="footer-links">
      <a href="#">About</a>
      <a href="#">Advertising</a>
      <a href="#">Business</a>
      <a href="#">How Search works</a>
      <div class="push"></div>
      <div class="footer-right">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Settings</a>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
